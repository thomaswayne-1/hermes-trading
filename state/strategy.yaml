version: "08"

entry:
  direction: both                  # long, short, or both

  # Long entry (oversold bounce)
  long_threshold: 55               # enter long when RSI < 55
  long_rsi_exit: 78                # exit long when RSI > 78

  # Short entry (overbought fade) — symmetric, same logic mirrored
  short_threshold: 65              # enter short when RSI > 65
  short_rsi_exit: 25               # exit short when RSI < 25

  # Confirmations — each one adds +1 to score (0 → min size, 3 → max size)
  # Long:  macd_hist > 0, bb_pct < 0.35, ob_imbalance > 0
  # Short: macd_hist < 0, bb_pct > 0.65, ob_imbalance < 0
  macd_confirm: true
  bb_confirm: true
  ob_confirm: true

  volume_surge_multiplier: 1.2     # current vol must be >= 1.2x 20-bar avg

# ── Stop / take-profit ────────────────────────────────────────────────────────
stop_loss_pct: 0.5

take_profit_mode: fixed            # 'fixed' or 'atr'
take_profit_pct: 0.5
take_profit_atr_multiplier: 2.5
take_profit_atr_min_pct: 0.5
take_profit_atr_max_pct: 3.0

trailing_stop_pct: 0

# ── Profit-lock trailing stop ─────────────────────────────────────────────────
# Once peak profit reaches activate%, a trailing stop kicks in.
# If price then pulls back trail% from that peak, exit and lock the profit.
profit_lock_activate_pct: 0.25    # activate when trade is up 0.25%
profit_lock_trail_pct: 0.15       # trail from peak by 0.15%

# ── Multiple concurrent positions ─────────────────────────────────────────────
max_open_positions: 3             # max trades open at the same time

# ── Dynamic leverage (scales with confirmation score) ─────────────────────────
# Score 1/4 (RSI only)  → leverage_base
# Score 4/4 (all align) → leverage_max
leverage_base: 1.5
leverage_max: 3.0                  # capped at 3x until win rate > 60%

# ── Dynamic position sizing (scales with confirmation score) ──────────────────
# Score 1/4 → position_size_base (15%)
# Score 4/4 → position_size_max  (40%)
position_size_base: 0.15
position_size_max: 0.40            # capped at 40% until win rate > 60%
position_size_atr_dampen: true     # reduce size when ATR is elevated

# ── Timing ────────────────────────────────────────────────────────────────────
reentry_cooldown_minutes: 1
